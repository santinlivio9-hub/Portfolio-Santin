<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Plan technique : vue en coupe d'un arbre monté sur deux roulements avec engrenage">
  <!-- Bannière originale — style « plan technique » · Livio Santin · BUT GMP -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <pattern id="grid5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#8FA3B8" stroke-opacity=".55" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#F5A300" stroke-opacity=".5" stroke-width="1.2"/>
    </pattern>
    <pattern id="hatch3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8FA3B8" stroke-opacity=".6" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5L10 5L0 8.5z" fill="#F5A300"/>
    </marker>
    <radialGradient id="glow" cx="72%" cy="8%" r="70%">
      <stop offset="0" stop-color="#F5A300" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F5A300" stop-opacity="0"/>
    </radialGradient>

    <!-- Demi-coupe supérieure, symétrisée par rapport à l'axe y = 450 -->
    <g id="half">
      <!-- Carter (coupé, hachuré) -->
      <path d="M360 220H1240V370H1200V355H1060V250H540V355H400V370H360Z" fill="url(#hatch)" stroke="#B7C6D6" stroke-width="2.2" stroke-linejoin="round"/>
      <!-- Arbre (non coupé, convention) -->
      <path d="M200 450V412H400V398H500V386H540V392H1060V386H1100V398H1200V412H1400V450" fill="#151B23" stroke="#D5DEE8" stroke-width="2.4" stroke-linejoin="round"/>
      <line x1="400" y1="412" x2="400" y2="398" stroke="#D5DEE8" stroke-width="1.4"/>
      <!-- Rainure de clavette -->
      <path d="M232 412V420H332V412" fill="none" stroke="#8FA3B8" stroke-width="1.4" stroke-dasharray="7 5"/>
      <!-- Roulements à billes -->
      <g stroke="#B7C6D6" stroke-width="1.8">
        <rect x="400" y="355" width="100" height="12" fill="url(#hatch3)"/>
        <rect x="400" y="386" width="100" height="12" fill="url(#hatch3)"/>
        <circle cx="450" cy="376.5" r="10.5" fill="#151B23"/>
        <rect x="1100" y="355" width="100" height="12" fill="url(#hatch3)"/>
        <rect x="1100" y="386" width="100" height="12" fill="url(#hatch3)"/>
        <circle cx="1150" cy="376.5" r="10.5" fill="#151B23"/>
      </g>
      <!-- Roue dentée (coupée) -->
      <path d="M740 392V360H785V300H720V270H880V300H815V360H860V392Z" fill="url(#hatch2)" stroke="#FFB020" stroke-width="2.2" stroke-linejoin="round"/>
      <line x1="706" y1="280" x2="894" y2="280" stroke="#FFB020" stroke-opacity=".7" stroke-width="1.2" stroke-dasharray="22 5 3 5"/>
      <!-- Entretoises -->
      <rect x="500" y="364" width="40" height="22" fill="none" stroke="#8FA3B8" stroke-width="1.4"/>
      <rect x="1060" y="364" width="40" height="22" fill="none" stroke="#8FA3B8" stroke-width="1.4"/>
      <!-- Couvercles -->
      <path d="M330 205H360V384H344V412H330Z" fill="url(#hatch)" stroke="#B7C6D6" stroke-width="1.8"/>
      <path d="M1240 205H1270V412H1256V384H1240Z" fill="url(#hatch)" stroke="#B7C6D6" stroke-width="1.8"/>
      <!-- Vis de couvercle -->
      <g stroke="#8FA3B8" stroke-width="1.2" fill="none">
        <rect x="318" y="226" width="12" height="18"/><line x1="330" y1="235" x2="392" y2="235" stroke-dasharray="6 4"/>
        <rect x="1270" y="226" width="12" height="18"/><line x1="1208" y1="235" x2="1270" y2="235" stroke-dasharray="6 4"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#0E1116"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#grid5)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Cadre de plan -->
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="#8FA3B8" stroke-opacity=".35" stroke-width="1.5"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#8FA3B8" stroke-opacity=".2" stroke-width="1"/>
  <g fill="#8FA3B8" fill-opacity=".45" font-family="ui-monospace, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="230" y="33">1</text><text x="600" y="33">2</text><text x="970" y="33">3</text><text x="1340" y="33">4</text>
    <text x="31" y="250">A</text><text x="31" y="560">B</text><text x="31" y="800">C</text>
  </g>

  <!-- Vue en coupe -->
  <g id="view">
    <use xlink:href="#half" href="#half"/>
    <use xlink:href="#half" href="#half" transform="translate(0 900) scale(1 -1)"/>
  </g>

  <!-- Axe -->
  <line x1="160" y1="450" x2="1440" y2="450" stroke="#F5A300" stroke-width="1.6" stroke-dasharray="34 7 4 7"/>
  <!-- Axes des roulements et de la roue -->
  <g stroke="#F5A300" stroke-opacity=".75" stroke-width="1.1" stroke-dasharray="20 6 3 6">
    <line x1="450" y1="330" x2="450" y2="570"/>
    <line x1="1150" y1="330" x2="1150" y2="570"/>
    <line x1="800" y1="240" x2="800" y2="660"/>
  </g>

  <!-- Cotation -->
  <g stroke="#F5A300" stroke-width="1.1" fill="none">
    <line x1="200" y1="500" x2="200" y2="782"/>
    <line x1="1400" y1="500" x2="1400" y2="782"/>
    <line x1="208" y1="770" x2="1392" y2="770" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="450" y1="580" x2="450" y2="722"/>
    <line x1="1150" y1="580" x2="1150" y2="722"/>
    <line x1="458" y1="710" x2="1142" y2="710" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="880" y1="270" x2="985" y2="270"/>
    <line x1="880" y1="630" x2="985" y2="630"/>
    <line x1="970" y1="278" x2="970" y2="622" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <g fill="#FFB020" font-family="ui-monospace, Consolas, monospace" font-size="20" text-anchor="middle">
    <text x="800" y="760">1200</text>
    <text x="800" y="700">700 ±0,05</text>
    <text x="0" y="0" transform="translate(992 450) rotate(-90)">Ø360</text>
    <text x="0" y="0" font-size="16" transform="translate(150 450) rotate(-90)">Ø76 h7</text>
  </g>
  <g stroke="#F5A300" stroke-width="1.1" fill="none">
    <line x1="160" y1="412" x2="198" y2="412"/>
    <line x1="160" y1="488" x2="198" y2="488"/>
    <line x1="168" y1="420" x2="168" y2="480" marker-start="url(#arr)" marker-end="url(#arr)"/>
  </g>
  <!-- Ajustement roulement -->
  <g stroke="#F5A300" stroke-width="1" fill="none">
    <path d="M450 336L520 150H600"/>
  </g>
  <text x="528" y="142" fill="#FFB020" font-family="ui-monospace, Consolas, monospace" font-size="17">Ø104 k6 / H7</text>

  <!-- Repères (bulles) -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">
    <g stroke="#FF7A18" stroke-width="1.2" fill="none">
      <path d="M260 430L210 330"/><path d="M1150 367L1230 140"/><path d="M800 280L760 120"/><path d="M1240 230L1330 110"/><path d="M1080 375L1060 120" stroke-dasharray="0"/>
    </g>
    <g fill="#0E1116" stroke="#FF7A18" stroke-width="1.6">
      <circle cx="204" cy="316" r="17"/><circle cx="1236" cy="124" r="17"/><circle cx="756" cy="104" r="17"/><circle cx="1340" cy="96" r="17"/><circle cx="1058" cy="104" r="17"/>
    </g>
    <g fill="#FFB020">
      <text x="204" y="322">1</text><text x="1236" y="130">2</text><text x="756" y="110">3</text><text x="1340" y="102">4</text><text x="1058" y="110">5</text>
    </g>
  </g>

  <!-- Repère de coupe -->
  <g font-family="ui-monospace, Consolas, monospace" fill="#F5A300">
    <text x="84" y="96" font-size="26" font-weight="700">A–A</text>
    <text x="84" y="120" font-size="13" fill="#8FA3B8" fill-opacity=".8">1 : 2</text>
  </g>

  <!-- Tolérance géométrique -->
  <g transform="translate(560 822)" font-family="ui-monospace, Consolas, monospace" font-size="16" fill="#C2CAD4">
    <rect width="168" height="30" fill="none" stroke="#8FA3B8" stroke-opacity=".7"/>
    <line x1="40" y1="0" x2="40" y2="30" stroke="#8FA3B8" stroke-opacity=".7"/>
    <line x1="120" y1="0" x2="120" y2="30" stroke="#8FA3B8" stroke-opacity=".7"/>
    <circle cx="20" cy="15" r="7.5" fill="none" stroke="#C2CAD4" stroke-width="1.4"/><circle cx="20" cy="15" r="3.5" fill="none" stroke="#C2CAD4" stroke-width="1.4"/>
    <text x="80" y="21" text-anchor="middle">0,02</text>
    <text x="144" y="21" text-anchor="middle">A-B</text>
  </g>

  <!-- Cartouche -->
  <g transform="translate(1196 794)" font-family="ui-monospace, Consolas, monospace" fill="#8FA3B8">
    <rect width="356" height="62" fill="#0E1116" fill-opacity=".6" stroke="#8FA3B8" stroke-opacity=".55"/>
    <line x1="96" y1="31" x2="356" y2="31" stroke="#8FA3B8" stroke-opacity=".4"/>
    <line x1="96" y1="0" x2="96" y2="62" stroke="#8FA3B8" stroke-opacity=".4"/>
    <line x1="236" y1="31" x2="236" y2="62" stroke="#8FA3B8" stroke-opacity=".4"/>
    <text x="48" y="40" font-size="26" font-weight="700" text-anchor="middle" fill="#F5A300">LS</text>
    <text x="110" y="22" font-size="15" fill="#C2CAD4">BUT GMP · IUT TROYES</text>
    <text x="110" y="52" font-size="13" fill="#C2CAD4">1:2 · A3</text>
    <text x="250" y="52" font-size="13" fill="#C2CAD4">GMP-01</text>
  </g>
</svg>
