<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Plan d'implantation vu de dessus d'une cellule robotisée de conditionnement de tartelettes">
  <!-- Illustration originale — SAÉ 2.2 Implantation d'une cellule robotisée · style « plan technique » -->
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <pattern id="g5" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0H0V200" fill="none" stroke="#fff" stroke-opacity=".07"/>
    </pattern>
    <pattern id="rollers" width="26" height="80" patternUnits="userSpaceOnUse">
      <line x1="13" y1="4" x2="13" y2="76" stroke="#8FA3B8" stroke-opacity=".35" stroke-width="2"/>
    </pattern>
    <pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8FA3B8" stroke-opacity=".5" stroke-width="1.2"/>
    </pattern>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 1.5L10 5L0 8.5z" fill="#F5A300"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#FF7A18"/>
    </marker>
    <g id="tart">
      <circle r="21" fill="#2A2116" stroke="#FFB020" stroke-width="2"/>
      <circle r="13" fill="none" stroke="#FFB020" stroke-opacity=".6" stroke-width="1.4" stroke-dasharray="4 3"/>
    </g>
    <g id="tray">
      <rect x="-70" y="-34" width="140" height="68" rx="6" fill="#151B23" stroke="#B7C6D6" stroke-width="1.8"/>
      <g fill="none" stroke="#8FA3B8" stroke-opacity=".7" stroke-width="1.3">
        <circle cx="-44" cy="-14" r="15"/><circle cx="0" cy="-14" r="15"/><circle cx="44" cy="-14" r="15"/>
        <circle cx="-44" cy="16" r="15"/><circle cx="0" cy="16" r="15"/><circle cx="44" cy="16" r="15"/>
      </g>
    </g>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#F5A300" stop-opacity=".12"/>
      <stop offset="1" stop-color="#F5A300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#0E1116"/>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#g5)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="#8FA3B8" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- Zone de travail du robot -->
  <circle cx="780" cy="450" r="330" fill="#F5A300" fill-opacity=".04" stroke="#F5A300" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray="16 8"/>
  <circle cx="780" cy="450" r="110" fill="none" stroke="#F5A300" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Clôture de sécurité -->
  <g>
    <path d="M300 150H1300V750H980M820 750H300Z" fill="none" stroke="#B7C6D6" stroke-opacity=".8" stroke-width="2.2" stroke-dasharray="2 0"/>
    <path d="M300 150H1300V750H980M820 750H300Z" fill="none" stroke="#0E1116" stroke-width="1" stroke-dasharray="3 9"/>
    <g fill="#B7C6D6">
      <rect x="294" y="144" width="12" height="12"/><rect x="544" y="144" width="12" height="12"/><rect x="794" y="144" width="12" height="12"/><rect x="1044" y="144" width="12" height="12"/><rect x="1294" y="144" width="12" height="12"/>
      <rect x="294" y="444" width="12" height="12"/><rect x="1294" y="444" width="12" height="12"/>
      <rect x="294" y="744" width="12" height="12"/><rect x="544" y="744" width="12" height="12"/><rect x="814" y="744" width="12" height="12"/><rect x="974" y="744" width="12" height="12"/><rect x="1294" y="744" width="12" height="12"/>
    </g>
    <!-- Porte d'accès -->
    <path d="M980 750A160 160 0 0 1 933 863" fill="none" stroke="#8FA3B8" stroke-opacity=".6" stroke-width="1.2" stroke-dasharray="5 5"/>
    <line x1="820" y1="750" x2="933" y2="863" stroke="#8FA3B8" stroke-opacity=".7" stroke-width="1.6"/>
  </g>

  <!-- Convoyeur d'entrée (tartelettes) -->
  <g>
    <rect x="70" y="250" width="1010" height="90" fill="#151B23" stroke="#D5DEE8" stroke-width="2.2"/>
    <rect x="70" y="255" width="1010" height="80" fill="url(#rollers)"/>
    <use href="#tart" x="130" y="295"/><use href="#tart" x="215" y="295"/><use href="#tart" x="300" y="295"/><use href="#tart" x="385" y="295"/>
    <use href="#tart" x="470" y="295"/><use href="#tart" x="555" y="295"/><use href="#tart" x="640" y="295"/><use href="#tart" x="725" y="295"/>
    <use href="#tart" x="810" y="295"/>
    <rect x="1080" y="240" width="22" height="110" fill="url(#h)" stroke="#B7C6D6" stroke-width="1.6"/>
    <line x1="110" y1="230" x2="420" y2="230" stroke="#FF7A18" stroke-width="2.4" marker-end="url(#flow)"/>
  </g>

  <!-- Convoyeur de sortie (barquettes) -->
  <g>
    <rect x="560" y="560" width="980" height="96" fill="#151B23" stroke="#D5DEE8" stroke-width="2.2"/>
    <rect x="560" y="568" width="980" height="80" fill="url(#rollers)"/>
    <rect x="538" y="550" width="22" height="116" fill="url(#h)" stroke="#B7C6D6" stroke-width="1.6"/>
    <use href="#tray" x="680" y="608"/><use href="#tray" x="880" y="608"/><use href="#tray" x="1080" y="608"/><use href="#tray" x="1280" y="608"/>
    <g fill="#2A2116" stroke="#FFB020" stroke-width="1.6">
      <circle cx="636" cy="594" r="12"/><circle cx="680" cy="594" r="12"/><circle cx="724" cy="594" r="12"/>
      <circle cx="636" cy="624" r="12"/>
      <circle cx="1036" cy="594" r="12"/><circle cx="1080" cy="594" r="12"/><circle cx="1124" cy="594" r="12"/><circle cx="1036" cy="624" r="12"/><circle cx="1080" cy="624" r="12"/><circle cx="1124" cy="624" r="12"/>
      <circle cx="1236" cy="594" r="12"/><circle cx="1280" cy="594" r="12"/><circle cx="1324" cy="594" r="12"/><circle cx="1236" cy="624" r="12"/><circle cx="1280" cy="624" r="12"/><circle cx="1324" cy="624" r="12"/>
    </g>
    <line x1="1140" y1="690" x2="1450" y2="690" stroke="#FF7A18" stroke-width="2.4" marker-end="url(#flow)"/>
  </g>

  <!-- Robot 6 axes (vue de dessus) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="780" cy="450" r="62" fill="#151B23" stroke="#D5DEE8" stroke-width="2.4"/>
    <circle cx="780" cy="450" r="40" fill="url(#h)" stroke="#B7C6D6" stroke-width="1.6"/>
    <g fill="#B7C6D6"><circle cx="736" cy="406" r="4"/><circle cx="824" cy="406" r="4"/><circle cx="736" cy="494" r="4"/><circle cx="824" cy="494" r="4"/></g>
    <!-- Bras -->
    <path d="M780 450L700 345L760 295" fill="none" stroke="#D5DEE8" stroke-width="38"/>
    <path d="M780 450L700 345L760 295" fill="none" stroke="#1C232C" stroke-width="33"/>
    <path d="M780 450L700 345L760 295" fill="none" stroke="#F5A300" stroke-opacity=".9" stroke-width="1.2" stroke-dasharray="14 5 3 5"/>
    <circle cx="700" cy="345" r="24" fill="#1C232C" stroke="#D5DEE8" stroke-width="2.2"/>
    <circle cx="700" cy="345" r="8" fill="none" stroke="#F5A300" stroke-width="1.6"/>
    <circle cx="780" cy="450" r="22" fill="#1C232C" stroke="#D5DEE8" stroke-width="2.2"/>
    <circle cx="780" cy="450" r="8" fill="none" stroke="#F5A300" stroke-width="1.6"/>
    <!-- Préhenseur à ventouses -->
    <g transform="translate(760 295) rotate(-40)">
      <rect x="-58" y="-12" width="116" height="24" rx="5" fill="#1C232C" stroke="#FFB020" stroke-width="2"/>
      <circle cx="-38" cy="0" r="17" fill="none" stroke="#FFB020" stroke-width="2"/>
      <circle cx="38" cy="0" r="17" fill="none" stroke="#FFB020" stroke-width="2"/>
      <circle cx="0" cy="0" r="9" fill="#FFB020"/>
    </g>
  </g>
  <!-- Trajectoire prise → dépose -->
  <path d="M770 300C900 330 760 520 636 600" fill="none" stroke="#FF7A18" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#flow)"/>

  <!-- Armoire de commande + poste opérateur -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="15" fill="#C2CAD4" text-anchor="middle">
    <rect x="1120" y="180" width="150" height="56" fill="#151B23" stroke="#B7C6D6" stroke-width="1.8"/>
    <line x1="1120" y1="196" x2="1270" y2="196" stroke="#8FA3B8" stroke-opacity=".6"/>
    <text x="1195" y="224">API · HMI</text>
    <rect x="330" y="640" width="96" height="70" fill="url(#h)" stroke="#B7C6D6" stroke-width="1.6"/>
  </g>

  <!-- Cotation -->
  <g stroke="#F5A300" stroke-width="1.1" fill="none">
    <line x1="300" y1="140" x2="300" y2="88"/><line x1="1300" y1="140" x2="1300" y2="88"/>
    <line x1="308" y1="100" x2="1292" y2="100" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="1310" y1="150" x2="1368" y2="150"/><line x1="1310" y1="750" x2="1368" y2="750"/>
    <line x1="1356" y1="158" x2="1356" y2="742" marker-start="url(#a)" marker-end="url(#a)"/>
    <line x1="780" y1="450" x2="1013" y2="217" marker-end="url(#a)"/>
  </g>
  <g fill="#FFB020" font-family="ui-monospace, Consolas, monospace" font-size="20" text-anchor="middle">
    <text x="800" y="90">5000</text>
    <text transform="translate(1384 450) rotate(90)">3000</text>
    <text x="1000" y="250" font-size="17" text-anchor="start" transform="rotate(-45 1000 250)">R 1650</text>
  </g>

  <!-- Repères -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="700" text-anchor="middle">
    <g stroke="#FF7A18" stroke-width="1.2" fill="none">
      <path d="M150 340L130 410"/><path d="M820 450L960 410"/><path d="M1400 656L1440 780"/><path d="M360 660L230 560"/><path d="M745 300L620 200"/>
    </g>
    <g fill="#0E1116" stroke="#FF7A18" stroke-width="1.6">
      <circle cx="126" cy="428" r="17"/><circle cx="977" cy="404" r="17"/><circle cx="1446" cy="798" r="17"/><circle cx="216" cy="552" r="17"/><circle cx="606" cy="188" r="17"/>
    </g>
    <g fill="#FFB020">
      <text x="126" y="434">1</text><text x="977" y="410">2</text><text x="1446" y="804">3</text><text x="216" y="558">4</text><text x="606" y="194">5</text>
    </g>
  </g>

  <!-- Cartouche -->
  <g transform="translate(60 794)" font-family="ui-monospace, Consolas, monospace" fill="#8FA3B8">
    <rect width="356" height="62" fill="#0E1116" fill-opacity=".6" stroke="#8FA3B8" stroke-opacity=".55"/>
    <line x1="96" y1="31" x2="356" y2="31" stroke="#8FA3B8" stroke-opacity=".4"/>
    <line x1="96" y1="0" x2="96" y2="62" stroke="#8FA3B8" stroke-opacity=".4"/>
    <text x="48" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#F5A300">SAÉ</text>
    <text x="110" y="22" font-size="15" fill="#C2CAD4">2.2 · IMPLANTATION</text>
    <text x="110" y="52" font-size="13" fill="#C2CAD4">VUE DE DESSUS · 1:50</text>
  </g>
</svg>
