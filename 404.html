<!DOCTYPE html>
<!--
  Page 404 — servie par GitHub Pages pour toute adresse inexistante du site.
  Les liens sont absolus (/Portfolio-Santin/...) car cette page peut s'afficher à n'importe quelle profondeur d'URL.
-->
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e1116" />
  <title>Page introuvable · Livio SANTIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F5A300'/%3E%3Cstop offset='1' stop-color='%23FF7A18'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='17' fill='url(%23g)'/%3E%3Ctext x='32' y='42.5' text-anchor='middle' font-family='Arial,sans-serif' font-size='29' font-weight='700' fill='%23161A20'%3ELS%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #F5A300; --accent-2: #FF7A18; --accent-ink: #161A20; --bg: #0E1116; --text: #E8ECF1; --mut: #8B95A3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; }
    main { position: relative; flex: 1; display: grid; place-items: center; text-align: center; padding: 48px 16px; overflow: hidden; }
    main::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 40px 40px; }
    main::after { content: ""; position: absolute; right: -160px; top: -160px; width: 480px; height: 480px; background: radial-gradient(circle, rgba(245,163,0,.3), transparent 65%); }
    .box { position: relative; z-index: 1; max-width: 560px; }
    .mark { display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 15px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); font: 700 1.3rem 'Space Grotesk', sans-serif; margin-bottom: 26px; }
    .code { font: 700 clamp(5rem, 22vw, 9rem)/1 'Space Grotesk', sans-serif; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 2px var(--accent); }
    .tol { font: 600 .9rem ui-monospace, Consolas, monospace; color: var(--accent); margin: 10px 0 22px; letter-spacing: .06em; }
    h1 { font: 600 clamp(1.4rem, 4vw, 1.9rem)/1.2 'Space Grotesk', sans-serif; margin-bottom: 10px; }
    p { color: var(--mut); line-height: 1.6; }
    p + p { margin-top: 4px; font-size: .92rem; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 8px; font-weight: 600; text-decoration: none; transition: transform .18s; }
    a.btn:hover { transform: translateY(-2px); }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); }
    .btn-ghost { border: 1px solid rgba(255,255,255,.28); color: #fff; }
    .hazard { height: 8px; background: repeating-linear-gradient(-45deg, var(--accent) 0 16px, #14181e 16px 32px); }
  </style>
</head>
<body>
  <main>
    <div class="box">
      <span class="mark" aria-hidden="true">LS</span>
      <div class="code" aria-hidden="true">404</div>
      <div class="tol" aria-hidden="true">Ø 404 ±0 — HORS TOLÉRANCE</div>
      <h1>Cette page est introuvable</h1>
      <p>L'adresse demandée n'existe pas ou a été déplacée.</p>
      <p lang="en">This page could not be found.</p>
      <div class="btns">
        <a class="btn btn-primary" href="/Portfolio-Santin/">Retour à l'accueil</a>
        <a class="btn btn-ghost" href="/Portfolio-Santin/?lang=en" lang="en">Back to home (EN)</a>
      </div>
    </div>
  </main>
  <div class="hazard" aria-hidden="true"></div>
</body>
</html>
